<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求关注</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    :root { --bg: #ffffff; }

    body {
        background: var(--bg);
        color: #1a1a1a;
        font-family: "Google Sans", "Microsoft YaHei", "PingFang SC", sans-serif;
        text-rendering: optimizeLegibility;
        min-height: 100vh;
        overflow: hidden;
    }

    .page {
        position: relative;
        width: 100%; height: 100vh;
        display: flex; justify-content: center; align-items: center;
        padding-left: 0;
        transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* ============ 菜单按钮（左上角） ============ */
    /* 默认（开关关）：纯色扁平，按原文件来 */
    .menu-btn {
        position: fixed; top: 22px; left: 22px;
        width: 58px; height: 58px;
        border-radius: 50%;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 6px;
        cursor: grab; z-index: 1000;
        border: 1px solid rgba(0,0,0,0.12);
        background: #e8e8e8;
        box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        transition: background 0.3s, box-shadow 0.3s, opacity 0.3s;
        transform: translateZ(0);
        will-change: transform;
    }
    .menu-btn:hover {
        background: #dedede;
    }
    .menu-btn.dragging { cursor: grabbing; }
    body.menu-open .menu-btn { opacity: 0; pointer-events: none; }

    /* 按下滤镜：inset:-1px 覆盖到边框外沿；z-index 5 盖住玻璃光环 */
    .menu-btn .white-filter {
        position: absolute; inset: -1px;
        border-radius: 50%; pointer-events: none; z-index: 5;
        background: rgba(255,255,255,0);
        transition: background 0.2s ease;
    }
    .menu-btn.dragging .white-filter {
        background: rgba(255,255,255,0.85);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }

    .menu-btn .bars {
        position: relative; z-index: 6;
        width: 24px; height: 18px;
        display: flex; flex-direction: column;
        justify-content: space-between;
        transform: translate(0,0); will-change: transform;
    }
    .menu-btn .bars span {
        display: block; width: 100%; height: 2px;
        background: #333333;
        border-radius: 2px;
    }

    /* ============ 页面主体 ============ */
    .card {
        background: transparent;
        border: none; border-radius: 24px;
        margin-top: 30px; padding: 44px 40px;
        text-align: center; max-width: 520px; width: 90%;
        box-shadow: none;
        position: relative; z-index: 3;
        transition: background 0.45s ease, box-shadow 0.45s ease;
    }
    .logo-row {
        display: flex; align-items: center; justify-content: center;
        gap: 0; margin-bottom: 14px;
    }
    .logo {
        position: absolute; top: 150px;
        left: 50%;
        transform: translateX(-50%);
        width: 208px; height: 117px;   /* 16:9 */
        display: block; border-radius: 0;
        background: transparent; border: none;
        box-shadow: none; padding: 0; z-index: 10;
        overflow: hidden;
    }
    .brand-name {
        font-size: 58px; font-weight: 800;
        letter-spacing: -1px; line-height: 1;
        color: #1a1a1a;
        transition: color 0.45s ease;
    }
    h1 { font-size: 24px; margin-bottom: 18px; font-weight: 700; color: #1a1a1a; }
    p  { font-size: 16px; margin-bottom: 28px; opacity: 0.7; color: #333; }

    /* ============ B站主页 / 小游戏按钮（与设置按钮同色） ============ */
    /* 默认（开关关）：纯色扁平 */
    .btn-wrapper {
        text-align: center; margin-top: 60px;
        display: flex; flex-direction: column; align-items: center; gap: 18px;
    }

    .page-footer {
        position: fixed;
        left: 0; right: 0; bottom: 26px;
        text-align: center;
        pointer-events: none;
        z-index: 1;
    }
    .page-footer .footer-brand {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: rgba(0, 0, 0, 0.42);
        transition: color 0.45s ease;
    }
    .page-footer .footer-version {
        margin-top: 5px;
        font-size: 12px;
        letter-spacing: 0.4px;
        color: rgba(0, 0, 0, 0.30);
        transition: color 0.45s ease;
    }

    /* 壁纸开启（深色）时：文字转白并加柔和暗影，保证可读 */
    body.glass-on .brand-name {
        color: #ffffff;
        text-shadow: 0 1px 14px rgba(0, 0, 0, 0.50), 0 2px 4px rgba(0, 0, 0, 0.32);
    }
    body.glass-on .page-footer .footer-brand {
        color: rgba(255, 255, 255, 0.88);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
    }
    body.glass-on .page-footer .footer-version {
        color: rgba(255, 255, 255, 0.62);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
    }

    /* ============ 横屏（手机横放）：Logo 与文字改为横向排列 ============ */
    @media (orientation: landscape) and (max-height: 700px) {
        /* 横屏：第一行 = Logo + 文字（并排紧挨），第二行 = 按钮（居中于两者下方） */
        .page {
            display: grid;
            grid-template-columns: auto auto;
            justify-content: center; align-items: center;
            column-gap: 14px; row-gap: 16px;
            padding: 0 18px;
        }
        /* Logo 从顶部绝对定位改为参与排列，尺寸保持 16:9 */
        .logo {
            position: static; top: auto; left: auto;
            transform: none;
            width: min(240px, 30vw); height: auto; aspect-ratio: 16 / 9;
            grid-column: 1; grid-row: 1;
        }
        /* card 用 contents 让内部两个块直接参与 page 的网格 */
        .card {
            margin-top: 0; padding: 0;
            width: auto; max-width: none;
            display: contents;
        }
        .logo-row {
            margin-bottom: 0; justify-content: flex-start;
            grid-column: 2; grid-row: 1;
        }
        .brand-name { font-size: clamp(40px, 8vw, 62px); }
        /* 按钮竖排，横跨两列居中 → 落在 Logo 与文字中间的下方 */
        .btn-wrapper {
            margin-top: 0;
            grid-column: 1 / 3; grid-row: 2;
            justify-self: center;
            flex-direction: column; align-items: center; gap: 26px;
        }
        a.btn { padding: 9px 20px; min-width: 104px; font-size: 14px; }
        .page-footer { bottom: 10px; }
        .page-footer .footer-brand { font-size: 13px; }
        .page-footer .footer-version { font-size: 11px; margin-top: 3px; }
    }

    a.btn {
        position: relative;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 10px 26px; min-width: 120px;
        text-decoration: none;
        font-size: 15px; font-weight: 600;
        /* 与左上角设置按钮同色：浅灰底 + 深色字 */
        color: #333333;
        border-radius: 50px;
        border: 1px solid rgba(0,0,0,0.12);
        background: #e8e8e8;
        box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        transition: background 0.3s, box-shadow 0.3s;
        overflow: hidden;
        transform: translateZ(0);
        will-change: transform;
        cursor: pointer;
        /* 禁止 a 标签原生拖拽（否则一拖动就出现拖拽幽灵图并中断 pointer 事件） */
        -webkit-user-drag: none;
        user-select: none;
        -webkit-user-select: none;
    }
    a.btn:hover {
        background: #dedede;
        box-shadow: 0 6px 18px rgba(0,0,0,0.14);
    }
    a.btn.dragging { cursor: grabbing; }

    /* 按下滤镜：inset:-1px 覆盖到边框外沿；z-index 5 盖住玻璃光环 */
    a.btn .white-filter {
        position: absolute; inset: -1px;
        border-radius: inherit; pointer-events: none; z-index: 5;
        background: rgba(255,255,255,0);
        transition: background 0.2s ease;
    }
    a.btn.dragging .white-filter {
        background: rgba(255,255,255,0.85);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }
    a.btn .btn-text { position: relative; z-index: 6; }

    /* ============ 设置菜单 ============ */
    /* 默认（开关关）：纯色扁平 */
    .settings {
        position: fixed;
        left: 0; top: 0;
        width: 100%; height: 100%;
        z-index: 2000;
        background: #f2f2f2;
        transform: translateY(100%);
        transition: transform 0.55s cubic-bezier(0.32, 0.72, 0, 1);
        display: flex; flex-direction: column;
        will-change: transform;
    }
    body.menu-open .settings { transform: translateY(0); }

    /* 面板玻璃 canvas：面板是 stacking context，canvas z-index 1 → 压在面板背景上、
       仍低于关闭按钮(z-index 10)，所以 ✕ 图标始终在玻璃之上清晰可见 */
    #glassCanvasPanel {
        position: absolute;
        left: 0; top: 0;
        z-index: 1;
        pointer-events: none;
        display: none;
    }

    .settings__bar { position: relative; height: 88px; flex-shrink: 0; }

    /* 关闭按钮：默认纯色扁平 */
    .close-btn {
        position: absolute;
        top: 22px; left: 22px;
        width: 58px; height: 58px;
        border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer;
        border: 1px solid rgba(0,0,0,0.12);
        background: #e8e8e8;
        box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        transition: background 0.3s, box-shadow 0.3s, transform 0.2s;
        transform: translateZ(0);
        z-index: 10;
    }
    .close-btn:hover { background: #dedede; }
    .close-btn:active { transform: scale(0.92); }

    .close-btn .cross { position: relative; z-index: 6; width: 24px; height: 24px; }
    .close-btn .cross::before,
    .close-btn .cross::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        width: 24px; height: 2.4px;
        background: #333333;
        border-radius: 2px;
        transform-origin: center;
    }
    .close-btn .cross::before { transform: translate(-50%, -50%) rotate(45deg); }
    .close-btn .cross::after  { transform: translate(-50%, -50%) rotate(-45deg); }

    .settings__content {
        flex: 1;
        display: flex; flex-direction: column;
        align-items: center; justify-content: flex-start;
        gap: 18px;
        padding: 8px 24px 60px;
        overflow-y: auto;
    }
    .settings__title {
        font-size: 30px; font-weight: 800;
        letter-spacing: -0.3px;
        color: #1a1a1a;
        margin-bottom: 8px;
    }
    .settings__item {
        width: 100%; max-width: 460px;
        padding: 18px 20px;
        border-radius: 16px;
        background: rgba(0,0,0,0.03);
        border: 1px solid rgba(0,0,0,0.08);
        display: flex; align-items: center; justify-content: space-between;
        gap: 14px;
    }
    .settings__item-label { font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .settings__item-desc { font-size: 13px; color: #888; margin-top: 3px; }

    .toggle {
        width: 48px; height: 27px; border-radius: 50px;
        background: rgba(0,0,0,0.2);
        position: relative; flex-shrink: 0;
        transition: background 0.25s;
    }
    .toggle::after {
        content: '';
        position: absolute; top: 2px; left: 2px;
        width: 23px; height: 23px; border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        transition: transform 0.25s;
    }
    .toggle.on { background: #1E6EDC; }
    .toggle.on::after { transform: translateX(21px); }

    /* ============================================================
       ★ iOS 26 / 27 Liquid Glass 液态玻璃材质
       组成：模糊折射 + 边缘光环(折射亮边) + 顶部镜面高光 + 多层阴影(厚度感)
       开关关闭 → 纯色扁平；开关开启 → 此液态玻璃材质
       ============================================================ */

    /* ---------- 圆形玻璃按钮（菜单按钮 / 关闭按钮） ---------- */
    body.glass-on .menu-btn,
    body.glass-on .close-btn {
        border: 1px solid rgba(255, 255, 255, 0.30);
        /* 本体半透明：不再叠加白色遮罩，靠 backdrop-filter 透出底层 */
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(11px) saturate(200%) brightness(1.06);
        -webkit-backdrop-filter: blur(11px) saturate(200%) brightness(1.06);
        /* 多层阴影：外扩散 + 内高光(玻璃厚度) + 内底阴影 */
        box-shadow:
            /* ---- 内侧边缘反射（iOS 26/27 玻璃内壁反光）---- */
            inset 0 1px 0.5px rgba(255, 255, 255, 0.62),   /* 上内缘：主反射（已大幅削弱，原 0.85 太金属） */
            inset 1px 0 0.5px rgba(255, 255, 255, 0.36),   /* 左内缘 */
            inset -1px 0 0.5px rgba(255, 255, 255, 0.28),  /* 右内缘 */
            inset 0 -1px 0.5px rgba(255, 255, 255, 0.26),  /* 下内缘：环境反射 */
            inset 0 2px 6px rgba(0, 0, 0, 0.05),           /* 内壁厚度阴影 */
            /* ---- 外扩散阴影 ---- */
            0 12px 32px rgba(0, 0, 0, 0.10),
            0 2px 8px rgba(0, 0, 0, 0.06);
        transition: background 0.3s, box-shadow 0.3s;
    }

    /* 顶部镜面高光斑（specular highlight） */
    body.glass-on .menu-btn::before,
    body.glass-on .close-btn::before {
        content: '';
        position: absolute;
        top: 3px;
        left: 18%;
        width: 64%;
        height: 34%;
        border-radius: 50%;
        background: linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.10) 0%,
            rgba(255, 255, 255, 0) 100%
        );
        filter: blur(1.5px);
        pointer-events: none;
        z-index: 2;
    }

    /* 内容始终压在玻璃反光之上，保证清晰可读 */
    body.glass-on .menu-btn .bars { z-index: 6; }
    body.glass-on .close-btn .cross { position: relative; z-index: 6; }

    body.glass-on .menu-btn:hover,
    body.glass-on .close-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        box-shadow:
            /* 内反射（hover 时略微增强） */
            inset 0 1px 0.5px rgba(255, 255, 255, 0.72),
            inset 1px 0 0.5px rgba(255, 255, 255, 0.44),
            inset -1px 0 0.5px rgba(255, 255, 255, 0.36),
            inset 0 -1px 0.5px rgba(255, 255, 255, 0.34),
            inset 0 2px 6px rgba(0, 0, 0, 0.06),
            0 16px 40px rgba(0, 0, 0, 0.13),
            0 3px 10px rgba(0, 0, 0, 0.07);
    }

    /* ---------- 设置菜单面板（大块玻璃） ---------- */
    body.glass-on .settings {
        background: rgba(255, 255, 255, 0.20);
        backdrop-filter: blur(16px) saturate(190%);
        -webkit-backdrop-filter: blur(16px) saturate(190%);
    }
    /* 面板顶部边缘高光 */
    body.glass-on .settings::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(
            90deg,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 255, 255, 0.90) 50%,
            rgba(255, 255, 255, 0) 100%
        );
        pointer-events: none;
        z-index: 5;
    }

    /* ---------- B站主页 / 小游戏按钮（无色玻璃胶囊，与左上角设置按钮同色） ---------- */
    body.glass-on a.btn {
        border: 1px solid rgba(255, 255, 255, 0.30);
        /* 本体半透明：与设置按钮一致，靠 backdrop-filter 透出底层 */
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(11px) saturate(200%) brightness(1.06);
        -webkit-backdrop-filter: blur(11px) saturate(200%) brightness(1.06);
        box-shadow:
            /* ---- 内侧边缘反射（iOS 26/27 玻璃内壁反光）---- */
            inset 0 1px 0.5px rgba(255, 255, 255, 0.62),   /* 上内缘：主反射 */
            inset 1px 0 0.5px rgba(255, 255, 255, 0.36),   /* 左内缘 */
            inset -1px 0 0.5px rgba(255, 255, 255, 0.28),  /* 右内缘 */
            inset 0 -1px 0.5px rgba(255, 255, 255, 0.26),  /* 下内缘：环境反射 */
            inset 0 2px 6px rgba(0, 0, 0, 0.05),           /* 内壁厚度阴影 */
            /* ---- 外扩散阴影 ---- */
            0 12px 32px rgba(0, 0, 0, 0.10),
            0 2px 8px rgba(0, 0, 0, 0.06);
    }
    /* 胶囊顶部镜面高光 */
    body.glass-on a.btn::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 12%;
        width: 76%;
        height: 40%;
        border-radius: 50%;
        background: linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.10) 0%,
            rgba(255, 255, 255, 0) 100%
        );
        filter: blur(1.5px);
        pointer-events: none;
        z-index: 2;
    }
    body.glass-on a.btn .btn-text {
        z-index: 6;
        /* 玻璃近乎透明、背景为深色壁纸时，白字配柔和暗影才可读 */
        color: #ffffff;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.35);
    }

    body.glass-on a.btn:hover {
        background: rgba(255, 255, 255, 0.08);
        box-shadow:
            /* 内反射（hover 时略微增强） */
            inset 0 1px 0.5px rgba(255, 255, 255, 0.72),
            inset 1px 0 0.5px rgba(255, 255, 255, 0.44),
            inset -1px 0 0.5px rgba(255, 255, 255, 0.36),
            inset 0 -1px 0.5px rgba(255, 255, 255, 0.34),
            inset 0 2px 6px rgba(0, 0, 0, 0.06),
            0 16px 40px rgba(0, 0, 0, 0.13),
            0 3px 10px rgba(0, 0, 0, 0.07);
    }

    /* ==========================================================
       移植自 Kyant0/AndroidLiquidGlass  (branch: kmp)
       核心：RoundedRectRefractionWithDispersion (AGSL -> GLSL)
       SDF 折射 + 7 段色散 + vibrancy(1.5) + Default highlight
       玻璃由 WebGL canvas 绘制；壁纸层提供可被折射的内容
       ========================================================== */
    .wallpaper {
        position: fixed; inset: 0; z-index: 0;
        pointer-events: none; opacity: 0;
        transition: opacity 0.45s ease;
    }
    body.glass-on .wallpaper { opacity: 1; }
    #wallpaper {
        background-color: #dde5f0;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    #glassCanvas {
        position: fixed; inset: 0; z-index: 2;
        pointer-events: none; display: block;
    }
    /* 按钮本体交给 canvas 画玻璃，自身只保留文字/图标 */
    /* ★ 只有「页面上的按钮」交给 canvas 画玻璃。
       设置面板(z-index 2000)与面板内的关闭按钮层级远高于 canvas(z-index 2)，
       canvas 画的玻璃会被面板本身盖住 —— 这两个必须用 CSS backdrop-filter 毛玻璃。 */
    body.webgl-glass .menu-btn,
    body.webgl-glass a.btn {
        background: transparent !important;
        box-shadow: none !important;
        border-color: transparent !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
    }
    body.webgl-glass .white-filter { display: none !important; }
    body.webgl-glass .menu-btn::before, body.webgl-glass .menu-btn::after,
    body.webgl-glass a.btn::before, body.webgl-glass a.btn::after { display: none !important; }
    a.btn { z-index: 3; }

    /* ★ 关闭按钮走面板内的独立 canvas（#glassCanvasPanel），同样把 CSS 玻璃清空，
       否则 CSS 毛玻璃会和 canvas 玻璃叠在一起变成两层。 */
    body.panel-glass .close-btn {
        background: transparent !important;
        box-shadow: none !important;
        border-color: transparent !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
    }
    body.panel-glass .close-btn::before { display: none !important; }
    /* 玻璃折射出来的是深色壁纸，✕ 用白色才能看清 */
    body.panel-glass .close-btn .cross::before,
    body.panel-glass .close-btn .cross::after {
        background: #ffffff;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    }
</style>
</head>
<body>

<div class="wallpaper" id="wallpaper"></div>

<canvas id="glassCanvas"></canvas>

<div class="page" id="page">
    <button class="menu-btn" id="menuBtn" aria-label="菜单">
        <span class="white-filter"></span>
        <span class="bars">
            <span></span><span></span><span></span>
        </span>
    </button>

    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <path id="big-trapezoid"
                  d="M 14,10 L 86,25 A 4 4 0 0 1 90,29 L 90,71 A 4 4 0 0 1 86,75 L 14,90 A 4 4 0 0 1 10,86 L 10,14 A 4 4 0 0 1 14,10 Z

<script>
/* ============ 通用拖拽弹性（完全搬运自原文件） ============ */
function makeGlassButton(btn, contentEl) {
    const FOLLOW   = 0.03;   /* 位移幅度：更小，只轻微跟手 */
    const SPRING   = 0.18;
    const FRICTION = 0.72;

    const MOVE_THRESHOLD = 5;   /* 超过这个位移才算"拖动"，否则视为点击 */

    let dragging = false;
    let moved = false;
    let suppressClick = false;
    let startX = 0, startY = 0;
    let dx = 0, dy = 0;
    let vx = 0, vy = 0;
    let rafId = null;

    /* 拉扯仅在液态玻璃开关开启时生效 */
    function canDrag() { return document.body.classList.contains('glass-on'); }

    const CONTENT_MOVE = 0.003;   /* 文字/图标微动：极小，几乎只看得出微妙偏移 */
    let cx = 0, cy = 0;

    /* 位移不再设上限（已删除 clamp 限制），完全跟随手指 */

    /* ---- 移植 LiquidButton.kt 的 layerBlock 形变 ---- */
    const INITIAL_DERIVATIVE = 0.05;   /* 与源码一致 */

    /* ★ 拉伸饱和系数：以 maxOffset 的这个比例作为拉伸饱和点。
       用已收敛的 tx/ty 而不是原始 dx/dy 驱动拉伸 ——
       原文 dx 无上限，小按钮（如 58px 圆形）dx/maxDim 会飙到 5 倍以上，
       scale 直接冲到 1.36，圆钮被拉成"药丸"。现在上限恒为 1 + 4/h。 */
    const DRAG_STRETCH_SAT = 0.3;      /* 越小越早饱和 → 拉伸越保守 */
    const DRAG_STRETCH_GAIN = 0.9;     /* 整体拉伸强度（1 = 源码 4dp/h） */

    function lgState() { return btn.__lgState || { press: 0, touchX: 0, touchY: 0 }; }

    function render() {
        const w = btn.offsetWidth, h = btn.offsetHeight;
        const maxOffset = Math.min(w, h);
        /* translationX = maxOffset * tanh(initialDerivative * offset / maxOffset) */
        const tx = maxOffset * Math.tanh(INITIAL_DERIVATIVE * dx / maxOffset);
        const ty = maxOffset * Math.tanh(INITIAL_DERIVATIVE * dy / maxOffset);

        const press = pressProgress;
        const baseScale = 1 + (4 / h) * press;          /* lerp(1, 1 + 4dp/h, progress) */
        const maxDragScale = (4 / h) * DRAG_STRETCH_GAIN;
        /* 有界拉伸比：tanh 保证 |t|/maxOffset < 1，再按饱和点截断到 1 */
        const txr = Math.min(1, Math.abs(tx) / (maxOffset * DRAG_STRETCH_SAT));
        const tyr = Math.min(1, Math.abs(ty) / (maxOffset * DRAG_STRETCH_SAT));
        const sx = baseScale + maxDragScale * txr * Math.min(w / h, 1);
        const sy = baseScale + maxDragScale * tyr * Math.min(h / w, 1);

        btn.style.transform =
            'translate3d(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px,0) scale(' +
            sx.toFixed(4) + ',' + sy.toFixed(4) + ')';

        if (contentEl) {
            cx += (dx * CONTENT_MOVE - cx) * 0.3;
            cy += (dy * CONTENT_MOVE - cy) * 0.3;
            contentEl.style.transform =
                'translate3d(' + cx.toFixed(2) + 'px,' + cy.toFixed(2) + 'px,0)';
        }

        const st = lgState();
        st.press = press;
        if (LiquidGlass) LiquidGlass.invalidate();
    }

    /* ---- 按压进度（源码 spring(0.5f, 300f)；此处用等效插值逼近） ---- */
    let pressProgress = 0, pressTarget = 0, pressRaf = null;
    function pressAnim() {
        pressProgress += (pressTarget - pressProgress) * 0.28;
        render();
        if (Math.abs(pressTarget - pressProgress) > 0.003 || dragging) {
            pressRaf = requestAnimationFrame(pressAnim);
        } else {
            pressProgress = pressTarget; render(); pressRaf = null;
        }
    }
    function startPressAnim() { if (pressRaf === null) pressRaf = requestAnimationFrame(pressAnim); }

    function onDown(e) {
        if (!canDrag()) return;
        dragging = true;
        moved = false;
        btn.classList.add('dragging');
        const p = e.touches ? e.touches[0] : e;
        startX = p.clientX - dx;
        startY = p.clientY - dy;
        const st = lgState();
        st.touchX = p.clientX; st.touchY = p.clientY;
        pressTarget = 1; startPressAnim();
        cancelAnimationFrame(rafId);
        /* ★ 关键：这里绝不能 preventDefault。
           pointerdown/touchstart 一旦被 preventDefault，浏览器就不会再生成 click 事件，
           a 标签（B站主页 / 小游戏）将永远无法跳转。 */
    }
    function onMove(e) {
        if (!dragging) return;
        const p = e.touches ? e.touches[0] : e;
        dx = p.clientX - startX;
        dy = p.clientY - startY;
        const stM = lgState();
        stM.touchX = p.clientX; stM.touchY = p.clientY;
        if (!moved && (Math.abs(dx) + Math.abs(dy)) > MOVE_THRESHOLD) moved = true;
        if (!moved) return;
        render();
        if (e.cancelable) e.preventDefault();   /* 只有真正在拖动时才阻止滚动 */
    }
    function onUp() {
        if (!dragging) return;
        dragging = false;
        btn.classList.remove('dragging');
        pressTarget = 0; startPressAnim();
        if (moved) {
            /* 拖动过 → 吃掉这一次 click，避免松手时误跳转 */
            suppressClick = true;
            setTimeout(function () { suppressClick = false; }, 300);
        }
        vx = dx * 0.03; vy = dy * 0.03;
        loop();
    }
    /* 拖动结束后抑制一次 click；未拖动则完全放行 → 正常跳转 */
    btn.addEventListener('click', function (e) {
        if (suppressClick) {
            e.preventDefault();
            e.stopPropagation();
            suppressClick = false;
        }
    }, true);
    function loop() {
        vx += (0 - dx) * SPRING; vy += (0 - dy) * SPRING;
        vx *= FRICTION; vy *= FRICTION;
        dx += vx; dy += vy;
        render();
        if (Math.abs(dx) < 0.2 && Math.abs(dy) < 0.2 && Math.abs(vx) < 0.2 && Math.abs(vy) < 0.2) {
            dx = dy = vx = vy = 0; cx = cy = 0;
            render(); return;
        }
        rafId = requestAnimationFrame(loop);
    }

    btn.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    btn.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);

    render();
}

/* ============ 绑定拖拽（不影响点击） ============ */
const menuBtn  = document.getElementById('menuBtn');
const biliBtn  = document.getElementById('biliBtn');
const gameBtn  = document.getElementById('gameBtn');
const settings = document.getElementById('settings');
const closeBtn = document.getElementById('closeBtn');
const body     = document.body;

makeGlassButton(menuBtn, menuBtn.querySelector('.bars'));
makeGlassButton(biliBtn, biliBtn.querySelector('.btn-text'));
makeGlassButton(gameBtn, gameBtn.querySelector('.btn-text'));

/* ============ 菜单开关 ============ */
/* 面板玻璃的渲染闸门：关闭动画（0.55s）期间仍要继续画，否则玻璃会瞬间消失 */
var panelCloseAt = 0;
function openMenu() {
    body.classList.add('menu-open');
    settings.setAttribute('aria-hidden', 'false');
    if (typeof PanelGlass !== 'undefined' && PanelGlass) PanelGlass.invalidate();
}
function closeMenu() {
    body.classList.remove('menu-open');
    settings.setAttribute('aria-hidden', 'true');
    panelCloseAt = Date.now() + 700;
    if (typeof PanelGlass !== 'undefined' && PanelGlass) PanelGlass.invalidate();
}

/* 菜单按钮：拖拽时不触发点击 */
let menuDownX = 0, menuDownY = 0;
menuBtn.addEventListener('pointerdown', function (e) {
    menuDownX = e.clientX; menuDownY = e.clientY;
});
menuBtn.addEventListener('click', function (e) {
    const moved = Math.abs(e.clientX - menuDownX) + Math.abs(e.clientY - menuDownY);
    if (moved < 6) openMenu();
});

/* 关闭按钮 */
closeBtn.addEventListener('click', closeMenu);

/* Esc 关闭 */
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && body.classList.contains('menu-open')) closeMenu();
});

/* ============ ★ 液态玻璃开关 ============ */
const glassToggle = document.getElementById('glassToggle');
glassToggle.addEventListener('click', function () {
    const on = glassToggle.classList.toggle('on');
    if (on) {
        body.classList.add('glass-on');
        if (LiquidGlass) LiquidGlass.enable();
        if (PanelGlass)  PanelGlass.enable();
    } else {
        body.classList.remove('glass-on');
        if (LiquidGlass) LiquidGlass.disable();
        if (PanelGlass)  PanelGlass.disable();
    }
    if (LiquidGlass) LiquidGlass.invalidate();
    if (PanelGlass)  PanelGlass.invalidate();
});

/* ★ 默认开启液态玻璃：无需点菜单即可生效 */
glassToggle.classList.add('on');
document.body.classList.add('glass-on');
if (LiquidGlass) LiquidGlass.invalidate();
if (PanelGlass)  PanelGlass.invalidate();

/* ============ 反光已固定在左上 / 右下转角，不再随陀螺仪游走 ============ */

/* ============================================================
   LiquidGlass — 移植自 Kyant0/AndroidLiquidGlass (branch kmp)
   源文件：backdrop/src/commonMain/.../internal/Shaders.kt
          · RoundedRectRefractionWithDispersionShaderString
          · DefaultHighlightShaderString
          effects/ColorFilter.kt · vibrancy = saturation 1.5
          effects/Lens.kt       · lens(12dp, 24dp)
          effects/Blur.kt       · blur(2dp)
          catalog/LiquidButton.kt · Highlight.Default + 交互形变
   ============================================================ */
function createLiquidGlass(canvasEl, opts) {
    opts = opts || {};
    /* originEl：非空时 rect / 采样坐标都相对该元素（面板 canvas 会随面板滑动，
       用相对坐标才能让玻璃始终贴在按钮上） */
    var originEl = opts.originEl || null;
    var gateFn   = opts.gate   || null;   /* 返回 false → 暂停渲染，省电 */
    var classOn  = opts.bodyClass || null;
    var canvas = canvasEl;
    if (!canvas) return null;
    var gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false, antialias: false, depth: false })
          || canvas.getContext('experimental-webgl', { alpha: true, premultipliedAlpha: false });
    if (!gl) { console.warn('[LiquidGlass] WebGL 不可用，沿用 CSS 玻璃'); return null; }

    /* ---------------- shaders ---------------- */
    var VS = [
        'attribute vec2 aPos;',
        'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
    ].join('\n');

    /* 高斯模糊 + vibrancy（saturation） */
    var FS_BLUR = [
        'precision highp float;',
        'uniform sampler2D uTex;',
        'uniform vec2 uRes;',
        'uniform vec2 uStep;',
        'uniform float uSat;',
        'void main(){',
        '    vec2 P = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);',
        '    vec2 uv = vec2(P.x / uRes.x, 1.0 - P.y / uRes.y);',
        '    vec3 c = texture2D(uTex, uv).rgb * 0.227027;',
        '    c += (texture2D(uTex, uv + uStep).rgb        + texture2D(uTex, uv - uStep).rgb)        * 0.1945946;',
        '    c += (texture2D(uTex, uv + uStep * 2.0).rgb  + texture2D(uTex, uv - uStep * 2.0).rgb)  * 0.1216216;',
        '    c += (texture2D(uTex, uv + uStep * 3.0).rgb  + texture2D(uTex, uv - uStep * 3.0).rgb)  * 0.0540540;',
        '    c += (texture2D(uTex, uv + uStep * 4.0).rgb  + texture2D(uTex, uv - uStep * 4.0).rgb)  * 0.0162162;',
        '    if (uSat > 0.0) {',
        '        float lum = dot(c, vec3(0.213, 0.715, 0.072));',
        '        c = mix(vec3(lum), c, uSat);',
        '    }',
        '    gl_FragColor = vec4(c, 1.0);',
        '}'
    ].join('\n');

    /* ★ 核心：圆角矩形折射 + 色散（逐行移植 AGSL） */
    var FS_REFRACT = [
        'precision highp float;',
        'uniform sampler2D uContent;',
        'uniform vec2  uRes;',
        'uniform float uDpr;',
        'uniform vec2  uOrigin;',      /* canvas 相对视口的原点（面板 canvas 随面板移动） */
        'uniform vec4  uRect;',        /* x, y, w, h —— CSS px，y 向下 */
        'uniform float uRadius;',
        'uniform float uRefractH;',    /* refractionHeight */
        'uniform float uRefractA;',    /* refractionAmount（传负值） */
        'uniform float uDepth;',
        'uniform float uChroma;',
        'uniform float uHiAlpha;',
        'uniform float uHiAngle;',
        'uniform float uHiFalloff;',
        'uniform float uHiMode;',
        'uniform float uHiStrokeW;',
        'uniform float uHiBlur;',
        'uniform float uReflDepth;',   /* 边缘内侧反射：向外最远采样距离（dp） */
        'uniform float uReflNear;',    /* 边缘内侧反射：最外缘的采样距离（dp） */
        'uniform float uPress;',
        'uniform vec2  uTouch;',
        'uniform float uTouchR;',
        'uniform vec3  uTint;',
        'uniform float uTintAmt;',

        'float sdRoundedRect(vec2 coord, vec2 halfSize, float radius){',
        '    vec2 cornerCoord = abs(coord) - (halfSize - vec2(radius));',
        '    float outside = length(max(cornerCoord, 0.0)) - radius;',
        '    float inside = min(max(cornerCoord.x, cornerCoord.y), 0.0);',
        '    return outside + inside;',
        '}',
        'vec2 gradSdRoundedRect(vec2 coord, vec2 halfSize, float radius){',
        '    vec2 cornerCoord = abs(coord) - (halfSize - vec2(radius));',
        '    if (cornerCoord.x >= 0.0 || cornerCoord.y >= 0.0) {',
        '        vec2 n = max(cornerCoord, 0.0);',
        '        float len = length(n);',
        '        if (len < 1e-5) return vec2(0.0);',
        '        return sign(coord) * n / len;',
        '    } else {',
        '        float gradX = step(cornerCoord.y, cornerCoord.x);',
        '        return sign(coord) * vec2(gradX, 1.0 - gradX);',
        '    }',
        '}',
        'float circleMap(float x){ return 1.0 - sqrt(max(0.0, 1.0 - x * x)); }',

        'vec3 sampleContent(vec2 P){',
        '    vec2 Q = P + uOrigin * uDpr;',
        '    vec2 uv = vec2(Q.x / uRes.x, 1.0 - Q.y / uRes.y);',
        '    return texture2D(uContent, clamp(uv, 0.0, 1.0)).rgb;',
        '}',

        'void main(){',
        '    vec2 P    = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);',
        '    vec2 cssP = P / uDpr;',
        '    vec2 halfSize = uRect.zw * 0.5;',
        '    vec2 center   = uRect.xy + halfSize;',
        '    vec2 c        = cssP - center;',
        '    float sd = sdRoundedRect(c, halfSize, uRadius);',
        '    float aa = 1.0 - smoothstep(-1.0, 1.0, sd * uDpr);',
        '    if (aa <= 0.001) discard;',

        '    vec3 color;',
        '    if (-sd >= uRefractH) {',
        '        color = sampleContent(P);',
        '    } else {',
        '        float sdc  = min(sd, 0.0);',
        '        float d    = circleMap(1.0 - (-sdc) / uRefractH) * uRefractA;',
        '        float gradR = min(uRadius * 1.5, min(halfSize.x, halfSize.y));',
        '        vec2  dir   = gradSdRoundedRect(c, halfSize, gradR) + uDepth * normalize(c + vec2(0.0001));',
        '        float dl    = length(dir);',
        '        vec2  grad  = dl < 1e-5 ? vec2(0.0) : dir / dl;',
        '        vec2  refractedCoord = cssP + d * grad;',
        '        float edgeGain = 1.0 + 1.8 * (1.0 - smoothstep(0.0, uRefractH, -sd));',
        '        float dispersionIntensity = uChroma * edgeGain * ((c.x * c.y) / (halfSize.x * halfSize.y));',
        '        vec2  dispersedCoord = d * grad * dispersionIntensity;',
        '        vec3 col = vec3(0.0);',
        '        vec3 s1 = sampleContent((refractedCoord + dispersedCoord) * uDpr);              col.r += s1.r / 3.5;',
        '        vec3 s2 = sampleContent((refractedCoord + dispersedCoord * (2.0 / 3.0)) * uDpr); col.r += s2.r / 3.5; col.g += s2.g / 7.0;',
        '        vec3 s3 = sampleContent((refractedCoord + dispersedCoord / 3.0) * uDpr);       col.r += s3.r / 3.5; col.g += s3.g / 3.5;',
        '        vec3 s4 = sampleContent(refractedCoord * uDpr);                                 col.g += s4.g / 3.5;',
        '        vec3 s5 = sampleContent((refractedCoord - dispersedCoord / 3.0) * uDpr);        col.g += s5.g / 3.5; col.b += s5.b / 3.0;',
        '        vec3 s6 = sampleContent((refractedCoord - dispersedCoord * (2.0 / 3.0)) * uDpr); col.b += s6.b / 3.0;',
        '        vec3 s7 = sampleContent((refractedCoord - dispersedCoord) * uDpr);             col.r += s7.r / 7.0; col.b += s7.b / 3.0;',
        '        color = col;',
        '    }',

        /* vibrancy 已在 blur pass 完成（saturation 1.5） */

        /* tint（LiquidButton 的 onDrawSurface：tint + tint@0.75）
           ★ 源码 0.75 会把按钮涂成不透明实色（像金属/塑料），
             这里降到 0.28（原 0.45 再降一档），让底下的折射内容透得更多 —— 玻璃必须是透的 */
        '    if (uTintAmt > 0.0) color = mix(color, uTint, 0.14 * uTintAmt);',

        /* ===== 边缘内侧反射背景（inner rim reflection）=====
           真实玻璃厚边缘的全内反射：边缘内侧那一圈看到的【不是白光】，
           而是"外侧背景被折叠映射进来"的内容 —— 用户要的就是这个。
           ① stroke mask：沿用 mt512 的等宽描边（只留内侧）
           ② t = 内侧深度（0 = 最外缘，1 = 带的内边界）
           ③ 沿形状法线【向外】采样，越往内映射到越远的外侧背景 → 压缩镜像
           ④ 方向性：迎光侧反射强、背光侧弱，保留 iOS 的立体感
           ⑤ 只做极小提亮（0.10），绝不加白 —— 反射的是内容，不是白色高光 */
        '    float gradR2 = min(uRadius * 1.5, min(halfSize.x, halfSize.y));',
        '    vec2  grad2  = gradSdRoundedRect(c, halfSize, gradR2);',
        '    vec2  normal = vec2(cos(uHiAngle), sin(uHiAngle));',
        '    float sdDev   = sd * uDpr;',
        '    float strokeH = max(uHiStrokeW * uDpr, 0.5);',
        '    float sigma   = max(uHiBlur * uDpr, 0.1);',
        /* ① 软钟形 mask：内外两端都平滑归零 —— 旧版是二值描边，所以带边界有一条硬线 */
        '    float t    = clamp(-sdDev / strokeH, 0.0, 1.0);',
        /* 纯高斯窗：C∞ 连续，两端自然趋零 —— 无平台、无 abrupt，反射带与内部彻底融合 */
        '    float bt   = (t - 0.26) / 0.30;',
        '    float bell = exp(-bt * bt);',
        '    float mask = bell * (1.0 - smoothstep(-0.75, 0.0, sdDev));',
        '    if (mask > 0.002) {',
        /* ② 深度映射用 smootherstep：外缘近、向内渐远，末端平滑收住不突断 */
        '        float ts     = t * t * (3.0 - 2.0 * t);',
        '        float travel = mix(uReflNear, uReflDepth, ts);',
        '        vec2  tan2   = vec2(-grad2.y, grad2.x);',
        /* ③ 沿边缘切向三次柔化采样 —— 反射是"磨砂"的，不再锐利生硬 */

            refractA: opt.refractA != null ? opt.refractA : -24,
            chroma:   opt.chroma   != null ? opt.chroma   : 1,
            hiAlpha:  opt.hiAlpha  != null ? opt.hiAlpha  : 1.0,     /* 反射混合强度 */
            hiMode:   opt.hiMode   != null ? opt.hiMode   : 1,
            hiStrokeW:opt.hiStrokeW!= null ? opt.hiStrokeW: 9.0,     /* dp，反射带宽度 */
            hiBlur:   opt.hiBlur   != null ? opt.hiBlur   : 3.2,     /* dp */
            hiFalloff:opt.hiFalloff!= null ? opt.hiFalloff: 1.0,     /* 站点 falloff = 1.0 */
            reflDepth:opt.reflDepth!= null ? opt.reflDepth: 28,      /* dp，向外采样最远距离 */
            reflNear: opt.reflNear != null ? opt.reflNear : 2.5,     /* dp，最外缘采样距离 */
            tint:     opt.tint || null,
            state: { press: 0, touchX: 0, touchY: 0 }
        };
        targets.push(t);
        el.__lgState = t.state;
        dirty = true;
        return t.state;
    }

    function blurPass(srcTex, dstFbo, stepX, stepY, sat) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, dstFbo.fb);
        gl.viewport(0, 0, W, H);
        gl.disable(gl.SCISSOR_TEST);
        gl.useProgram(progBlur);
        gl.bindBuffer(gl.ARRAY_BUFFER, quad);
        var loc = gl.getAttribLocation(progBlur, 'aPos');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, srcTex);
        gl.uniform1i(uB.uTex, 0);
        gl.uniform2f(uB.uRes, W, H);
        gl.uniform2f(uB.uStep, stepX, stepY);
        gl.uniform1f(uB.uSat, sat || 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    function drawTarget(t) {
        var el = t.el;
        var r = el.getBoundingClientRect();
        if (r.width < 1 || r.height < 1) return;
        var st = getComputedStyle(el);
        if (st.display === 'none' || st.visibility === 'hidden' || parseFloat(st.opacity) < 0.01) return;

        var radius = t.radius >= 0 ? t.radius : Math.min(r.width, r.height) / 2;
        radius = Math.min(radius, Math.min(r.width, r.height) / 2);

        /* ★ 坐标换算：canvas 若挂在某个容器里（如设置面板），画布本身会随容器移动，
           所以 rect 与采样原点都要换算成「相对该容器」的坐标，玻璃才能贴在按钮上。 */
        var ox = 0, oy = 0;
        if (originEl) { var pr = originEl.getBoundingClientRect(); ox = pr.left; oy = pr.top; }
        var left = r.left - ox, top = r.top - oy;

        var pad = Math.abs(t.refractA) + t.refractH + 4;
        var x0 = Math.max(0, Math.floor((left - pad) * dpr));
        var y0 = Math.max(0, Math.floor((top  - pad) * dpr));
        var x1 = Math.min(W, Math.ceil((left + r.width  + pad) * dpr));
        var y1 = Math.min(H, Math.ceil((top  + r.height + pad) * dpr));
        if (x1 <= x0 || y1 <= y0) return;

        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(x0, H - y1, x1 - x0, y1 - y0);
        gl.useProgram(progRefr);
        gl.bindBuffer(gl.ARRAY_BUFFER, quad);
        var loc = gl.getAttribLocation(progRefr, 'aPos');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, fboB.tex);
        gl.uniform1i(uR.uContent, 0);
        gl.uniform2f(uR.uRes, W, H);
        gl.uniform1f(uR.uDpr, dpr);
        gl.uniform2f(uR.uOrigin, ox, oy);
        gl.uniform4f(uR.uRect, left, top, r.width, r.height);
        gl.uniform1f(uR.uRadius, radius);
        gl.uniform1f(uR.uRefractH, t.refractH);
        gl.uniform1f(uR.uRefractA, t.refractA);
        gl.uniform1f(uR.uDepth, 0);
        gl.uniform1f(uR.uChroma, t.chroma);
        gl.uniform1f(uR.uHiAlpha, t.hiAlpha);
        gl.uniform1f(uR.uHiAngle, 45 * Math.PI / 180);
        gl.uniform1f(uR.uHiFalloff, t.hiFalloff != null ? t.hiFalloff : 1.0);
        gl.uniform1f(uR.uHiMode, t.hiMode != null ? t.hiMode : 1);
        gl.uniform1f(uR.uHiStrokeW, t.hiStrokeW != null ? t.hiStrokeW : 9.0);
        gl.uniform1f(uR.uHiBlur, t.hiBlur != null ? t.hiBlur : 3.2);
        gl.uniform1f(uR.uReflDepth, t.reflDepth != null ? t.reflDepth : 28);
        gl.uniform1f(uR.uReflNear, t.reflNear != null ? t.reflNear : 2.5);
        gl.uniform1f(uR.uPress, t.state.press || 0);
        gl.uniform2f(uR.uTouch, t.state.touchX || 0, t.state.touchY || 0);
        gl.uniform1f(uR.uTouchR, Math.min(r.width, r.height) * 1.5);
        if (t.tint) { gl.uniform3f(uR.uTint, t.tint[0], t.tint[1], t.tint[2]); gl.uniform1f(uR.uTintAmt, 1); }
        else { gl.uniform3f(uR.uTint, 0, 0, 0); gl.uniform1f(uR.uTintAmt, 0); }

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.disable(gl.SCISSOR_TEST);
    }

    var dirty = true, running = false;
    var wallpaper = null;
    var lastRects = [];

    /* ★ 几何变化检测：按钮被拖动 / 弹簧回弹 / 菜单滑出 / 页面滚动时，
       canvas 必须立刻重绘，否则玻璃与光辉会停在旧位置 —— 也就是"光辉离开按钮" */
    function geomChanged() {
        var changed = false;
        for (var i = 0; i < targets.length; i++) {
            var el = targets[i].el;
            var r = el.getBoundingClientRect();
            var p = lastRects[i];
            if (!p || Math.abs(p[0] - r.left)   > 0.3 ||
                      Math.abs(p[1] - r.top)    > 0.3 ||
                      Math.abs(p[2] - r.width)  > 0.3 ||
                      Math.abs(p[3] - r.height) > 0.3) changed = true;
            lastRects[i] = [r.left, r.top, r.width, r.height];
        }
        return changed;
    }

    function render() {
        /* blur(2dp) -> vibrancy(1.5) */
        var rad = 1.1 * dpr;
        blurPass(bgTex, fboA, rad / W, 0, 0);
        blurPass(fboA.tex, fboB, 0, -rad / H, 1.5);

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, W, H);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        for (var i = 0; i < targets.length; i++) drawTarget(targets[i]);
    }

    function frame() {
        if (!document.body.classList.contains('glass-on') || document.hidden ||
            (gateFn && !gateFn())) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.viewport(0, 0, W, H);
            gl.disable(gl.SCISSOR_TEST);
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            running = false; dirty = true; lastRects = [];
            return;
        }
        /* ★ 每帧检测：位置一变就重绘，静止时只做廉价的 rect 比对 */
        if (dirty || geomChanged()) { render(); dirty = false; }
        requestAnimationFrame(frame);
    }
    function start() {
        if (!running && document.body.classList.contains('glass-on') && !document.hidden &&
            (!gateFn || gateFn())) {
            running = true; requestAnimationFrame(frame);
        }
    }
    function invalidate() {
        dirty = true;
        start();
    }

    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', start);
    window.addEventListener('scroll', invalidate, true);
    resize();

    /* ★ 开关关闭时必须撤掉 webgl-glass
       该类用 !important 把按钮的 background / box-shadow / border / backdrop-filter
       全部清空（玻璃改由 canvas 绘制）。若关闭时不移除，按钮本体会整个消失，
       只剩文字浮在白底上 —— 也就是"关闭后按钮什么都没有了"。 */
    function clearCanvas() {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, W, H);
        gl.disable(gl.SCISSOR_TEST);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    }
    function enable() {
        canvas.style.display = 'block';
        if (classOn) document.body.classList.add(classOn);
        resize();
        invalidate();
    }
    function disable() {
        if (classOn) document.body.classList.remove(classOn);
        running = false; dirty = true; lastRects = [];
        clearCanvas();
        canvas.style.display = 'none';
    }
    enable();

    return { register: register, invalidate: invalidate, resize: resize,
             enable: enable, disable: disable,
             get targets() { return targets; } };
}

/* ① 主画布：页面上的按钮（菜单 / B站主页 / 小游戏） */
var LiquidGlass = createLiquidGlass(document.getElementById('glassCanvas'),
                                    { bodyClass: 'webgl-glass' });

/* ② 面板画布：设置面板内的关闭按钮
      —— 面板 z-index 2000，主画布 z-index 2 画不到它，必须挂在面板内部。
      面板关闭时 gate 为 false，停止渲染不耗电；关闭动画期间留 700ms 宽限。 */
var PanelGlass = createLiquidGlass(document.getElementById('glassCanvasPanel'), {
    originEl: document.getElementById('settings'),
    bodyClass: 'panel-glass',
    gate: function () {
        return document.body.classList.contains('menu-open') || Date.now() < panelCloseAt;
    }
});



/* ============ 注册 WebGL 玻璃目标（移植参数） ============ */
if (LiquidGlass) {
    /* LiquidButton: lens(12dp, 24dp) + blur(2dp) + Highlight.Default */
    LiquidGlass.register(menuBtn, { radius: -1, refractH: 12, refractA: -24, chroma: 1 });
    /* 与左上角设置按钮同色：不带 tint，纯无色玻璃 */
    LiquidGlass.register(biliBtn, { radius: -1, refractH: 12, refractA: -24, chroma: 1 });
    LiquidGlass.register(gameBtn, { radius: -1, refractH: 12, refractA: -24, chroma: 1 });
    /* 关闭按钮：交给面板内的独立 canvas（PanelGlass），与菜单按钮同一套液态玻璃 */
    if (PanelGlass) {
        PanelGlass.register(closeBtn, { radius: -1, refractH: 12, refractA: -24, chroma: 1 });
        PanelGlass.invalidate();
    }
    /* settings 整块面板走 CSS backdrop-filter 毛玻璃（大块面板，canvas 玻璃性价比低） */
    LiquidGlass.invalidate();
}
</script>
</body>
