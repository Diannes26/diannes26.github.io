<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/Diannes.png" type="image/x-icon">
    <title>欢迎来到Diannes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #000;
            padding: 40px;
            text-align: left;
            max-width: 550px;
            width: 90%;
        }
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .logo {
            width: 120px;
            height: 120px;
            display: block;
        }
        .brand-name {
            font-size: 50px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #fff;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
            margin-left: -2px;
        }
        p {
            font-size: 16px;
            margin-bottom: 30px;
            margin-left: -2px;
        }
        .btn-wrapper {
            text-align: left;
            margin-left: -2px;
        }
        a.btn {
            display: inline-block;
            background: #fff;
            color: #000;
            padding: 8px 18px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #fff;
            border-radius: 50px;
            transition: none;
        }
        /* 点击下压回弹动画 */
        a.btn:active {
            animation: pressBounce 0.15s ease-out;
        }
        @keyframes pressBounce {
            0%   { transform: translateY(0); }
            40%  { transform: translateY(4px); }
            100% { transform: translateY(0); }
        }
    </style>
    
</head>
<body>

<!-- SVG 定义区：封装大梯形和小梯形 -->
<svg width="0" height="0" style="position:absolute;">
    <defs>
        <!-- 大白色梯形 -->
        <polygon id="big-trapezoid" points="10,10 90,25 90,75 10,90" fill="#fff"/>
        <!-- 小黑色梯形 -->
        <polygon id="small-trapezoid" points="32,28 78,36 78,64 32,72" fill="#000"/>
    </defs>
</svg>

<div class="card">
    <!-- Logo + 品牌名横排（居中，不左移） -->
    <div class="logo-row">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" fill="#000"/>
            <g transform="scale(-1, 1) translate(-100, 0)">
                <use href="#big-trapezoid"/>
                <use href="#small-trapezoid"/>
            </g>
        </svg>
        <span class="brand-name">Diannes</span>
    </div>

    <h1>求关注</h1>
    <p>感谢你的支持！</p>
    <div class="btn-wrapper">
        <a href="https://space.bilibili.com/3493267880545214" target="_blank" class="btn">B站主页</a>
    </div>
</div>
</body>
</html>
